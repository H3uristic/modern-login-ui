 <!DOCTYPE html>
  <html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090b1a">

    <title>ورود به حساب کاربری</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <canvas id="particles"></canvas>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <div class="background-shape shape-three"></div>

    <main class="login-page">
      <section class="login-card">
        <div class="card-glow"></div>

        <div class="logo">
          <span>✦</span>
        </div>

        <div class="heading">
          <h1>خوش برگشتی!</h1>
          <p>برای ادامه وارد حساب کاربری خود شوید.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="input-group">
            <label for="email">ایمیل</label>

            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M4 6h16v12H4z"></path>
                  <path d="m4 7 8 6 8-6"></path>
                </svg>
              </span>

              <input
                id="email"
                name="email"
                type="email"
                placeholder="example@email.com"
                autocomplete="email"
              >

              <span class="status-icon"></span>
            </div>

            <small class="error-message"></small>
          </div>

          <div class="input-group">
            <label for="password">رمز عبور</label>

            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>

              <input
                id="password"
                name="password"
                type="password"
                placeholder="حداقل ۸ کاراکتر"
                autocomplete="current-password"
              >

              <button
                id="togglePassword"
                class="password-toggle"
                type="button"
                aria-label="نمایش رمز عبور"
              >
                <svg class="eye-open" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>

                <svg class="eye-closed hidden" viewBox="0 0 24 24">
                  <path d="m3 3 18 18"></path>
                  <path d="M10.6 6.2A11 11 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-2.1 2.8"></path>
                  <path d="M6.6 6.6C3.6 8.4 2 12 2 12s3.5 6 10 6a10 10 0 0 0 4.1-.8"></path>
                </svg>
              </button>
            </div>

            <div class="password-strength">
              <span></span>
            </div>

            <small class="error-message"></small>
          </div>

          <div class="form-options">
            <label class="remember">
              <input type="checkbox" id="remember">
              <span class="custom-checkbox">✓</span>
              مرا به خاطر بسپار
            </label>

            <a href="#">رمز عبور را فراموش کردی؟</a>
          </div>

          <button class="login-button" type="submit">
            <span class="button-text">ورود به حساب</span>
            <span class="loader"></span>
            <span class="success-check">✓</span>
          </button>

          <div id="formMessage" class="form-message"></div>
        </form>

        <div class="divider">
          <span>یا ورود با</span>
        </div>

        <div class="social-buttons">
          <button type="button" class="social-button">
            <span class="google-icon">G</span>
            گوگل
          </button>

          <button type="button" class="social-button">
            <span class="github-icon">◆</span>
            گیت‌هاب
          </button>
        </div>

        <p class="register">
          حساب کاربری نداری؟
          <a href="#">ثبت‌نام کن</a>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
  </html>
